<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    color: #111827;
    font-size: 14px;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  .center-screen { display: flex; align-items: center; justify-content: center; min-height: 90vh; }

  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0; }
  h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0; }
  .muted { color: #6b7280; }
  .small { font-size: 12px; }
  .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; }
  .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }

  a, .link { color: #4f46e5; text-decoration: none; cursor: pointer; font-weight: 500; }
  a:hover, .link:hover { color: #4338ca; }

  .card {
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 10px;
    padding: 16px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-start { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .gap-2 { display: flex; gap: 8px; }
  .gap-3 { display: flex; gap: 12px; align-items: center; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-DRAFT { background: #f3f4f6; color: #374151; }
  .badge-SUBMITTED { background: #dbeafe; color: #1d4ed8; }
  .badge-APPROVED { background: #d1fae5; color: #047857; }
  .badge-RETURNED { background: #fef3c7; color: #b45309; }
  .badge-ok { background: #d1fae5; color: #047857; }
  .badge-bad { background: #fee2e2; color: #b91c1c; }

  nav.topnav {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 24px;
  }
  nav.topnav .left { display: flex; gap: 24px; align-items: center; }
  nav.topnav .right { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #6b7280; }
  .brand { font-weight: 700; color: #111827; }
  .navlink { font-size: 14px; color: #4b5563; cursor: pointer; }
  .navlink:hover { color: #111827; }

  input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea, select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
  }
  input:disabled, textarea:disabled { background: #f3f4f6; color: #6b7280; }
  input[type="range"] { width: 100%; }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-secondary { background: #fff; color: #374151; border-color: #d1d5db; }
  .btn-secondary:hover:not(:disabled) { background: #f9fafb; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #b91c1c; }
  .btn-approve { background: #059669; color: #fff; }
  .btn-approve:hover:not(:disabled) { background: #047857; }
  .btn-return { background: #d97706; color: #fff; }
  .btn-return:hover:not(:disabled) { background: #b45309; }
  .btn-ghost { background: none; color: #9ca3af; border: none; padding: 4px 8px; }
  .btn-ghost:hover { color: #dc2626; }
  .btn-dashed {
    background: none; border: 1px dashed #d1d5db; color: #4b5563; width: 100%;
  }
  .btn-dashed:hover { border-color: #818cf8; color: #4f46e5; }

  .alert { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .alert-error { background: #fef2f2; color: #b91c1c; }
  .alert-warn { background: #fffbeb; color: #92400e; }
  .alert-ok { background: #ecfdf5; color: #047857; }

  .login-box { width: 100%; max-width: 360px; border: 1px solid #e5e7eb; background: #fff; border-radius: 10px; padding: 28px; }
  .login-logo { display: block; height: 44px; width: auto; margin: 0 auto 16px; }
  .nav-logo { height: 28px; width: auto; }

  ul.bullets { margin: 4px 0 0; padding-left: 18px; }
  ul.bullets li { margin-bottom: 2px; }

  .spinner-inline { font-size: 12px; color: #6b7280; }
</style>
