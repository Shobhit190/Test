  function uid() {
    return "k" + Math.random().toString(36).slice(2, 10);
  }

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function runRpc(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          reject(err);
        });
      runner[fnName].apply(runner, args);
    });
  }

  function setContent(html) {
    document.getElementById("content").innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Nav shell
  // ---------------------------------------------------------------------
  function navHtml() {
    var u = state.user;
    var links = '<span class="navlink" onclick="goDashboard()">Goal Setting</span>' +
      '<span class="navlink" onclick="goGoal()">My Goals</span>' +
      '<span class="navlink" onclick="goPromotion()">My Development</span>';
    if (u.systemRole === "MANAGER" || u.systemRole === "HR_ADMIN") {
      links += '<span class="navlink" onclick="goApprovals()">Approvals</span>';
    }
    if (u.systemRole === "HR_ADMIN") {
      links += '<span class="navlink" onclick="goReport()">Report</span>';
    }
    return (
      '<nav class="topnav">' +
      '<div class="left"><img class="nav-logo" src="data:image/png;base64,' + LOGO_BASE64 + '" alt="Elevate Education" />' +
      links + '</div>' +
      '<div class="right"><span>' + esc(u.name) + "</span>" +
      '<span class="link" onclick="logout()">Sign out</span></div></nav>'
    );
  }

  function statusBadge(status) {
    var label = status === "RETURNED" ? "Revision Required" : status;
    return '<span class="badge badge-' + status + '">' + label + "</span>";
  }

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  function renderLogin() {
    var errorHtml = state.loginError
      ? '<p class="alert alert-error mt-4">' + esc(state.loginError) + "</p>"
      : "";
    setContent(
      '<div class="center-screen"><div class="login-box">' +
        '<img class="login-logo" src="data:image/png;base64,' + LOGO_BASE64 + '" alt="Elevate Education" />' +
        "<h1>Elevate Goal Setting Portal</h1>" +
        '<p class="muted mt-1">Sign in to continue</p>' +
        errorHtml +
        '<div class="stack mt-4">' +
        '<div><label class="small">Email</label>' +
        '<input type="email" id="login-email" placeholder="you@company.com" /></div>' +
        '<div><label class="small">Password</label>' +
        '<input type="password" id="login-password" placeholder="Employee Code" /></div>' +
        '<button class="btn-primary" onclick="doLogin()" id="login-btn">Sign in</button>' +
        "</div>" +
        '<p class="small muted mt-4">Sign in with your work email. Your password is your Employee Code, ' +
        "unless HR has set a different one for you.</p>" +
        "</div></div>"
    );
    document.getElementById("login-password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
  }

  function doLogin() {
    var email = document.getElementById("login-email").value;
    var password = document.getElementById("login-password").value;
    var btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Signing in...";
    runRpc("login", email, password)
      .then(function (user) {
        state.user = user;
        state.loginError = null;
        goGuidelines();
      })
      .catch(function (err) {
        state.loginError = err.message || "Invalid email or password.";
        renderLogin();
      });
  }

  function logout() {
    state.user = null;
    state.goal = null;
    state.approvals = null;
    state.approvalDetail = null;
    state.view = "login";
    renderLogin();
  }

  // ---------------------------------------------------------------------
  // Guidelines (shown once, right after login, before the dashboard)
  // ---------------------------------------------------------------------
  var GUIDELINES = [
    "Set 2–5 KRAs for your goals, with the total weightage adding up to 100%.",
    "For each KRA, you may add up to 3 KPIs to define measurable outcomes, if required.",
    "You can save your draft at any time. Your goals will not be submitted until you choose to submit them.",
    "After submission, your manager can approve your goals or return them with comments for revision and resubmission.",
    "On the Development tab, assess yourself against each competency based on your current capabilities and your ability to demonstrate the expected behaviors. These ratings do not impact your goal score but will be tracked over time to support your career development. Please complete the self-assessment before submitting your goals.",
  ];

  function goGuidelines() {
    state.view = "guidelines";
    var firstName = (state.user.name || "").split(" ")[0] || state.user.name;
    var html =
      '<div class="center-screen"><div class="login-box" style="max-width:480px;text-align:left">' +
      "<h1>Welcome, " +
      esc(firstName) +
      "</h1>" +
      '<p class="muted mt-1">A few quick guidelines before you get started:</p>' +
      '<ul class="bullets mt-4">' +
      GUIDELINES.map(function (g) {
        return "<li>" + esc(g) + "</li>";
      }).join("") +
      "</ul>" +
      '<button class="btn-primary mt-6" onclick="goDashboard()">Continue to Dashboard</button>' +
      "</div></div>";
    setContent(html);
  }

  // ---------------------------------------------------------------------
  // Dashboard
  // ---------------------------------------------------------------------
  function goDashboard() {
    state.view = "dashboard";
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getDashboard", state.user.id).then(renderDashboard).catch(showFatal);
  }

  function profileRow_(label, value) {
    return (
      '<div class="row"><span class="small muted">' +
      esc(label) +
      '</span><span class="small" style="font-weight:500">' +
      esc(value || "—") +
      "</span></div>"
    );
  }

  function renderDashboard(data) {
    var myGoal = data.myGoal;
    var p = data.profile;
    var html = navHtml();
    html += "<h1>Employee Dashboard</h1>";

    html += '<div class="card mt-4"><h3>My Details</h3><div class="stack" style="gap:6px">';
    html += profileRow_("Employee Code", p.employeeCode);
    html += profileRow_("Brand", p.brand);
    html += profileRow_("Entity", p.entity);
    html += profileRow_("Designation", p.designationName);
    html += profileRow_("Reporting Manager", p.managerName);
    html += profileRow_("Goal Cycle", p.goalCycle);
    html += "</div></div>";

    html += '<div class="card mt-6"><div class="row">';
    html += "<div><p><strong>My Goals</strong></p>";
    html +=
      '<p class="small muted mt-1">' +
      myGoal.kras.length +
      (myGoal.kras.length === 1 ? " KRA" : " KRAs") +
      "</p></div>";
    html +=
      '<div class="gap-3">' +
      statusBadge(myGoal.status) +
      '<span class="link" onclick="goGoal()">Open &rarr;</span></div>';
    html += "</div></div>";

    if (data.isManagerOrHr) {
      html += '<div class="mt-8"><div class="row">';
      html += "<h2>" + (data.isHrAdmin ? "Org-wide rollup" : "My team") + "</h2></div>";

      if (data.teamGoals.length === 0) {
        html += '<div class="stack mt-3"><p class="card muted" style="text-align:center;">No goals yet this cycle.</p></div>';
      } else if (data.isHrAdmin) {
        // Org-wide rollup has no single manager to be "direct" relative to,
        // so it stays a flat list.
        html += '<div class="stack mt-3">';
        data.teamGoals.forEach(function (g) {
          html += teamMemberCardHtml_(g);
        });
        html += "</div>";
      } else {
        var direct = data.teamGoals.filter(function (g) {
          return g.isDirectReport;
        });
        var skipLevel = data.teamGoals.filter(function (g) {
          return !g.isDirectReport;
        });

        html += '<h3 class="mt-5">Direct reports</h3>';
        html += '<div class="stack mt-2">';
        html +=
          direct.length === 0
            ? '<p class="card muted" style="text-align:center;">No direct reports with a goal yet this cycle.</p>'
            : direct.map(teamMemberCardHtml_).join("");
        html += "</div>";

        if (skipLevel.length > 0) {
          html += '<h3 class="mt-6">Skip-level reports</h3>';
          html += '<div class="stack mt-2">' + skipLevel.map(teamMemberCardHtml_).join("") + "</div>";
        }
      }
      html += "</div>";
    }

    setContent(html);
  }

  function teamMemberCardHtml_(g) {
    var clickable = g.status !== "DRAFT";
    return (
      '<div class="card row"' +
      (clickable ? ' style="cursor:pointer" onclick="openApproval(\'' + g.id + '\')"' : ' style="opacity:0.7"') +
      ">" +
      '<div><p style="font-weight:500">' +
      esc(g.employeeName) +
      '</p><p class="small muted">' +
      esc(g.designationName || "—") +
      "</p></div>" +
      statusBadge(g.status) +
      "</div>"
    );
  }

  // ---------------------------------------------------------------------
  // Goal screen
  // ---------------------------------------------------------------------
  var STATUS_LABELS = {
    DRAFT: "Draft",
    SUBMITTED: "Submitted — awaiting manager approval",
    APPROVED: "Approved",
    RETURNED: "Revision Required",
  };

  function goGoal(preserveMessage, errorsToShow) {
    state.view = "goal";
    if (!preserveMessage) state.goalMessage = null;
    state.goalErrors = errorsToShow || [];
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getGoalScreen", state.user.id)
      .then(function (data) {
        state.goal = data;
        state.kras = data.goal.kras.map(function (k) {
          return {
            key: uid(),
            title: k.title,
            description: k.description || "",
            weight: k.weight,
            kpis: k.kpis.map(function (kpi) {
              return { key: uid(), title: kpi.title, target: kpi.target || "" };
            }),
          };
        });
        renderGoal();
      })
      .catch(showFatal);
  }

  function weightTotal() {
    return state.kras.reduce(function (sum, k) {
      return sum + (Number(k.weight) || 0);
    }, 0);
  }

  function levelForSubLevel(levels, subLevel) {
    for (var i = 0; i < levels.length; i++) {
      if (subLevel >= levels[i].subLevelMin && subLevel <= levels[i].subLevelMax) return levels[i];
    }
    return levels[0];
  }

  // The competency meter's fill is a CSS custom property rather than a
  // structural width, so the same gradient track just re-paints in place on
  // drag instead of needing a separate overlay element kept in sync.
  function meterFillPercent_(subLevel) {
    var pct = ((Number(subLevel) - 1) / 9) * 100;
    return Math.max(0, Math.min(100, pct));
  }

  // Renders the five lettered rungs (A-E) under the meter, highlighting
  // whichever band the current rating falls in -- the ladder motif that
  // replaces the old plain "E · 9/10" text badge.
  function meterTicksHtml_(levels, subLevel) {
    return levels
      .map(function (l) {
        var active = subLevel >= l.subLevelMin && subLevel <= l.subLevelMax;
        return "<span" + (active ? ' class="active"' : "") + ">" + esc(l.level) + "</span>";
      })
      .join("");
  }

  function renderGoal() {
    var editable = state.goal.editable;
    var html = navHtml();
    html +=
      '<div class="row"><h1>My Goals</h1><span class="badge badge-' +
      state.goal.goal.status +
      '">' +
      esc(STATUS_LABELS[state.goal.goal.status]) +
      "</span></div>";

    if (state.goal.goal.status === "RETURNED") {
      var lastReturn = state.goal.goal.approvalHistory
        .slice()
        .reverse()
        .filter(function (h) {
          return h.action === "RETURN";
        })[0];
      if (lastReturn) {
        html +=
          '<div class="alert alert-warn mt-4"><strong>Manager Comments (' +
          esc(lastReturn.actorName) +
          "):</strong><br/>" +
          esc(lastReturn.comment) +
          "</div>";
      }
    }

    if (!editable) {
      html += '<p class="alert alert-warn mt-4">This goal is read-only in its current state.</p>';
    }
    if (state.goalErrors.length > 0) {
      var needsPromotionRatings = state.goalErrors.some(function (e) {
        return e.indexOf("Development tab") !== -1;
      });
      html +=
        '<div class="alert alert-error mt-4"><strong>Please fix the following:</strong><ul class="bullets">' +
        state.goalErrors.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") +
        "</ul>" +
        (needsPromotionRatings
          ? '<span class="link small" onclick="goPromotion()">Go to the Development tab &rarr;</span>'
          : "") +
        "</div>";
    }
    if (state.goalMessage) {
      html += '<p class="alert alert-ok mt-4">' + esc(state.goalMessage) + "</p>";
    }

    // --- KRAs ---
    var total = weightTotal();
    html += '<div class="mt-6"><div class="row">';
    html += "<h2>KRAs &amp; KPIs</h2>";
    html +=
      '<span class="badge ' +
      (total === KRA_WEIGHT_TOTAL ? "badge-ok" : "badge-bad") +
      '" id="weight-total-badge">Total weightage: ' +
      total +
      "% / " +
      KRA_WEIGHT_TOTAL +
      "%</span></div>";
    html +=
      '<p class="small muted mt-1">Between ' +
      MIN_KRAS +
      " and " +
      MAX_KRAS +
      " KRAs, weightage adding up to " +
      KRA_WEIGHT_TOTAL +
      "%. Up to " +
      MAX_KPIS_PER_KRA +
      " KPIs per KRA (optional).</p>";

    html += '<div class="stack mt-4">';
    state.kras.forEach(function (kra, kIndex) {
      html += '<div class="card">';
      html += '<div class="row-start">';
      html += '<div class="stack" style="flex:1">';
      html += '<div class="gap-2">';
      html +=
        '<input type="text" style="flex:1" placeholder="KRA #' +
        (kIndex + 1) +
        ' title" value="' +
        esc(kra.title) +
        '" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'title\',this.value)" />';
      html +=
        '<input type="number" style="width:90px" value="' +
        kra.weight +
        '" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'weight\',this.value)" /><span class="muted" style="align-self:center">%</span>';
      html += "</div>";
      html +=
        '<textarea rows="2" placeholder="Description (optional)" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'description\',this.value)">' +
        esc(kra.description) +
        "</textarea>";

      html += '<div class="stack" style="padding-left:8px;gap:6px">';
      kra.kpis.forEach(function (kpi) {
        html += '<div class="gap-2">';
        html +=
          '<input type="text" style="flex:1" placeholder="KPI" value="' +
          esc(kpi.title) +
          '" ' +
          (editable ? "" : "disabled ") +
          'oninput="updateKpi(\'' +
          kra.key +
          "','" +
          kpi.key +
          '\',\'title\',this.value)" />';
        html +=
          '<input type="text" style="width:160px" placeholder="Target" value="' +
          esc(kpi.target) +
          '" ' +
          (editable ? "" : "disabled ") +
          'oninput="updateKpi(\'' +
          kra.key +
          "','" +
          kpi.key +
          '\',\'target\',this.value)" />';
        if (editable) {
          html +=
            '<span class="btn-ghost" style="cursor:pointer" onclick="removeKpi(\'' +
            kra.key +
            "','" +
            kpi.key +
            '\')">Remove</span>';
        }
        html += "</div>";
      });
      if (editable && kra.kpis.length < MAX_KPIS_PER_KRA) {
        html += '<span class="link small" onclick="addKpi(\'' + kra.key + '\')">+ Add KPI</span>';
      }
      html += "</div>"; // kpis stack
      html += "</div>"; // kra fields stack

      if (editable) {
        html +=
          '<span class="btn-ghost" style="cursor:pointer" onclick="removeKra(\'' +
          kra.key +
          '\')">Remove KRA</span>';
      }
      html += "</div></div>"; // row-start, card
    });
    html += "</div>"; // kras stack

    if (editable && state.kras.length < MAX_KRAS) {
      html += '<button class="btn-dashed mt-3" onclick="addKra()">+ Add KRA</button>';
    }
    html += "</div>"; // KRA section

    if (editable) {
      html += '<div class="gap-2 mt-8 actions-divider">';
      html += '<button class="btn-secondary" onclick="saveDraft()" id="save-btn">Save draft</button>';
      html += '<button class="btn-primary" onclick="goPromotion()">Next: Rate competencies &rarr;</button>';
      html += "</div>";
    }

    setContent(html);
  }

  // Plain text/description fields update state only (no re-render) so the
  // input never loses focus mid-keystroke. Fields with live dependent UI
  // (weight -> total badge, subLevel -> level badge/name/bullets) patch
  // just that bit of DOM directly instead of re-rendering the whole screen.
  function updateKra(key, field, value) {
    state.kras.forEach(function (k) {
      if (k.key === key) k[field] = field === "weight" ? Number(value) : value;
    });
    if (field === "weight") updateWeightBadge();
  }
  function updateWeightBadge() {
    var el = document.getElementById("weight-total-badge");
    if (!el) return;
    var total = weightTotal();
    el.textContent = "Total weightage: " + total + "% / " + KRA_WEIGHT_TOTAL + "%";
    el.className = "badge " + (total === KRA_WEIGHT_TOTAL ? "badge-ok" : "badge-bad");
  }
  function addKra() {
    if (state.kras.length >= MAX_KRAS) return;
    state.kras.push({ key: uid(), title: "", description: "", weight: 0, kpis: [] });
    renderGoal();
  }
  function removeKra(key) {
    state.kras = state.kras.filter(function (k) { return k.key !== key; });
    renderGoal();
  }
  function addKpi(kraKey) {
    state.kras.forEach(function (k) {
      if (k.key === kraKey && k.kpis.length < MAX_KPIS_PER_KRA) {
        k.kpis.push({ key: uid(), title: "", target: "" });
      }
    });
    renderGoal();
  }
  function updateKpi(kraKey, kpiKey, field, value) {
    state.kras.forEach(function (k) {
      if (k.key !== kraKey) return;
      k.kpis.forEach(function (kpi) {
        if (kpi.key === kpiKey) kpi[field] = value;
      });
    });
    // No re-render: title/target have no live dependent UI to update.
  }
  function removeKpi(kraKey, kpiKey) {
    state.kras.forEach(function (k) {
      if (k.key === kraKey) k.kpis = k.kpis.filter(function (kpi) { return kpi.key !== kpiKey; });
    });
    renderGoal();
  }
  function goalPayload() {
    return {
      kras: state.kras.map(function (k) {
        return {
          title: k.title,
          description: k.description,
          weight: Number(k.weight) || 0,
          kpis: k.kpis.map(function (kpi) {
            return { title: kpi.title, target: kpi.target };
          }),
        };
      }),
    };
  }

  // saveDraft/submitGoalClick disable both buttons for the duration of the
  // round trip: without this, a second click before the first request
  // returns (easy to do while waiting on a slow response) fires an
  // overlapping saveGoalDraft call, which can leave duplicate KRA rows.
  function setGoalButtonsBusy_(busy) {
    ["save-btn", "submit-btn"].forEach(function (id) {
      var btn = document.getElementById(id);
      if (btn) btn.disabled = busy;
    });
  }

  function saveDraft() {
    state.goalMessage = null;
    state.goalErrors = [];
    setGoalButtonsBusy_(true);
    var payload = goalPayload();
    runRpc("saveGoalDraft", state.user.id, state.goal.goal.id, payload.kras)
      .then(function (result) {
        if (!result.ok) {
          state.goalErrors = result.errors;
          setGoalButtonsBusy_(false);
          renderGoal();
        } else {
          state.goalMessage = "Draft saved.";
          goGoal(true);
        }
      })
      .catch(function (err) {
        setGoalButtonsBusy_(false);
        showFatal(err);
      });
  }

  // ---------------------------------------------------------------------
  // Development / promotion-readiness self-assessment
  // ---------------------------------------------------------------------
  function goPromotion(preserveMessage) {
    state.view = "promotion";
    if (!preserveMessage) state.promotionMessage = null;
    state.promotionError = null;
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getPromotionScreen", state.user.id)
      .then(function (data) {
        state.promotion = data;
        var byCompetency = {};
        data.ratings.forEach(function (r) {
          byCompetency[r.competencyId] = r;
        });
        state.promotionRatings = data.options.map(function (o) {
          var existing = byCompetency[o.competency.id];
          return {
            competencyId: o.competency.id,
            subLevel: existing ? existing.subLevel : 5,
            selfComment: existing ? existing.selfComment : "",
          };
        });
        renderPromotion();
      })
      .catch(showFatal);
  }

  function promotionRatingByCompetency_(competencyId) {
    return state.promotionRatings.filter(function (r) {
      return r.competencyId === competencyId;
    })[0];
  }

  function idealRatingLabel_(min, max) {
    if (min === null || max === null || isNaN(min) || isNaN(max)) return null;
    return min === max ? String(min) : min + "–" + max;
  }

  function renderPromotion() {
    var p = state.promotion;
    var html = navHtml();
    html += "<h1>Role Readiness</h1>";

    var idealLabel = idealRatingLabel_(p.targetMaturityMin, p.targetMaturityMax);
    if (idealLabel) {
      html +=
        '<span class="badge badge-ok mt-2">Expected Average Rating: ' +
        esc(idealLabel) +
        "/10</span>";
    }

    if (state.promotionMessage) {
      html += '<p class="alert alert-ok mt-4">' + esc(state.promotionMessage) + "</p>";
    }
    if (state.promotionError) {
      html += '<p class="alert alert-error mt-4">' + esc(state.promotionError) + "</p>";
    }

    if (!p.currentLevelName) {
      html +=
        '<p class="alert alert-warn mt-4">Your Business Role isn\'t set yet, so there are no competencies to ' +
        "show here. Ask HR to add it to your profile.</p>";
      setContent(html);
      return;
    }

    if (!p.editable) {
      html +=
        '<p class="alert alert-warn mt-4">Your ratings are locked while your goal is ' +
        esc(STATUS_LABELS[p.goalStatus] || p.goalStatus) +
        ".</p>";
    }

    if (p.isTopLevel) {
      html += '<p class="muted mt-1">Rate yourself against your own level\'s competencies to keep tracking your growth.</p>';
    } else {
      html += '<p class="muted mt-1">These competencies reflect the capabilities expected for your next career progression.</p>';
    }
    html +=
      '<p class="small muted mt-2">Please assess yourself against each competency based on your current ' +
      "capabilities and your ability to demonstrate the expected behaviors. These ratings do not impact your " +
      "goal score but will be tracked over time to support your career development. Please provide a " +
      "thoughtful and realistic self-assessment.</p>";

    html += '<div class="stack mt-6">';
    p.options.forEach(function (o) {
      var comp = o.competency;
      var rating = promotionRatingByCompetency_(comp.id);
      var level = levelForSubLevel(comp.levels, rating.subLevel);
      html += '<div class="card comp-card">';

      html += '<div class="comp-head"><div>';
      html += '<p class="comp-name">' + esc(comp.name) + "</p>";
      html += '<p class="small muted mt-1">' + esc(comp.cluster) + " &middot; " + esc(comp.subCluster) + "</p>";
      html += "</div>";
      html +=
        '<div class="comp-score" id="promo-level-badge-' +
        comp.id +
        '"><span class="num">' +
        rating.subLevel +
        '</span><span class="den">/10</span></div>';
      html += "</div>"; // comp-head

      html += '<div class="meter">';
      html +=
        '<input type="range" min="1" max="10" value="' +
        rating.subLevel +
        '" id="promo-slider-' +
        comp.id +
        '" style="--fill:' +
        meterFillPercent_(rating.subLevel) +
        '%" ' +
        (p.editable ? "" : "disabled ") +
        'oninput="updatePromotionRating(\'' +
        comp.id +
        '\',\'subLevel\',this.value)" />';
      html +=
        '<div class="meter-ticks" id="promo-ticks-' +
        comp.id +
        '">' +
        meterTicksHtml_(comp.levels, rating.subLevel) +
        "</div>";
      html += "</div>"; // meter

      html +=
        '<p class="comp-level-name" id="promo-level-name-' +
        comp.id +
        '">' +
        (level ? esc(level.levelName) : "") +
        "</p>";

      html +=
        '<ul class="bullets small muted mt-2" id="promo-level-bullets-' +
        comp.id +
        '">' +
        (level
          ? level.behaviourIndicators.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("")
          : "") +
        "</ul>";

      html +=
        '<textarea rows="2" class="mt-3" placeholder="Self-Assessment Comments (optional)" ' +
        (p.editable ? "" : "disabled ") +
        'oninput="updatePromotionRating(\'' +
        comp.id +
        '\',\'selfComment\',this.value)">' +
        esc(rating.selfComment) +
        "</textarea>";
      html += "</div>"; // comp-card
    });
    html += "</div>";

    if (p.editable) {
      html += '<div class="gap-2 mt-8 actions-divider">';
      html += '<button class="btn-primary" onclick="savePromotionRatingsClick()" id="save-promotion-btn">Save ratings</button>';
      if (state.goal && state.goal.editable) {
        html += '<button class="btn-primary" onclick="submitFromPromotionClick()" id="submit-promotion-btn">Submit for approval</button>';
      }
      html += "</div>";

      if (!state.goal) {
        html +=
          '<p class="small muted mt-3">Set your KRAs on the <span class="link" onclick="goGoal()">My Goals</span> ' +
          "tab first, then come back here to submit.</p>";
      } else if (!state.goal.editable) {
        html +=
          '<p class="small muted mt-3">Your goal (' +
          esc(STATUS_LABELS[state.goal.goal.status]) +
          ") isn't editable right now, so there's nothing to submit.</p>";
      }
    }

    setContent(html);
  }

  function updatePromotionRating(competencyId, field, value) {
    var rating = promotionRatingByCompetency_(competencyId);
    if (!rating) return;
    rating[field] = field === "subLevel" ? Number(value) : value;
    if (field === "subLevel") updatePromotionRatingLevelUI(competencyId);
  }

  function promotionOptionByCompetency_(competencyId) {
    var opt = state.promotion.options.filter(function (o) {
      return o.competency.id === competencyId;
    })[0];
    return opt ? opt.competency : null;
  }

  function updatePromotionRatingLevelUI(competencyId) {
    var rating = promotionRatingByCompetency_(competencyId);
    var comp = promotionOptionByCompetency_(competencyId);
    if (!rating || !comp) return;
    var level = levelForSubLevel(comp.levels, rating.subLevel);

    var scoreEl = document.getElementById("promo-level-badge-" + competencyId);
    if (scoreEl) {
      scoreEl.innerHTML = '<span class="num">' + rating.subLevel + '</span><span class="den">/10</span>';
    }

    var slider = document.getElementById("promo-slider-" + competencyId);
    if (slider) slider.style.setProperty("--fill", meterFillPercent_(rating.subLevel) + "%");

    var ticksEl = document.getElementById("promo-ticks-" + competencyId);
    if (ticksEl) ticksEl.innerHTML = meterTicksHtml_(comp.levels, rating.subLevel);

    var nameEl = document.getElementById("promo-level-name-" + competencyId);
    if (nameEl) nameEl.textContent = level ? level.levelName : "";

    var bulletsEl = document.getElementById("promo-level-bullets-" + competencyId);
    if (bulletsEl) {
      bulletsEl.innerHTML = level
        ? level.behaviourIndicators.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("")
        : "";
    }
  }

  // Disables both Development-tab buttons for the duration of a request,
  // same reasoning as setGoalButtonsBusy_ on the Goal screen.
  function setPromotionButtonsBusy_(busy) {
    ["save-promotion-btn", "submit-promotion-btn"].forEach(function (id) {
      var btn = document.getElementById(id);
      if (btn) btn.disabled = busy;
    });
  }

  function savePromotionRatingsClick() {
    setPromotionButtonsBusy_(true);
    runRpc("savePromotionRatings", state.user.id, state.promotionRatings)
      .then(function (result) {
        if (!result.ok) {
          state.promotionError = result.errors.join(" ");
          setPromotionButtonsBusy_(false);
          renderPromotion();
          return;
        }
        state.promotionMessage = "Ratings saved.";
        goPromotion(true);
      })
      .catch(function (err) {
        setPromotionButtonsBusy_(false);
        showFatal(err);
      });
  }

  // The Development tab's "Submit for approval": saves the ratings shown
  // here, then submits the goal already loaded from the My Goals tab this
  // session (state.goal/state.kras). Only shown when that goal is loaded
  // and editable -- see renderPromotion().
  function submitFromPromotionClick() {
    setPromotionButtonsBusy_(true);
    var payload = goalPayload();
    runRpc("savePromotionRatings", state.user.id, state.promotionRatings)
      .then(function (ratingsResult) {
        if (!ratingsResult.ok) {
          state.promotionError = ratingsResult.errors.join(" ");
          setPromotionButtonsBusy_(false);
          renderPromotion();
          return null;
        }
        return runRpc("saveGoalDraft", state.user.id, state.goal.goal.id, payload.kras);
      })
      .then(function (saveResult) {
        if (!saveResult) return null;
        if (!saveResult.ok) {
          setPromotionButtonsBusy_(false);
          goGoal(false, saveResult.errors);
          return null;
        }
        return runRpc("submitGoal", state.user.id, state.goal.goal.id);
      })
      .then(function (submitResult) {
        if (!submitResult) return;
        if (!submitResult.ok) {
          setPromotionButtonsBusy_(false);
          goGoal(false, submitResult.errors);
        } else {
          state.goalMessage = "Goal submitted for manager approval.";
          goGoal(true);
        }
      })
      .catch(function (err) {
        setPromotionButtonsBusy_(false);
        showFatal(err);
      });
  }

  // ---------------------------------------------------------------------
  // Approvals
  // ---------------------------------------------------------------------
  function goApprovals() {
    state.view = "approvals";
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getApprovalQueue", state.user.id).then(renderApprovals).catch(showFatal);
  }

  function renderApprovals(data) {
    state.approvals = data;
    var html = navHtml();
    html += "<h1>Approval Queue</h1>";
    html +=
      '<p class="small muted mt-1">' +
      (data.isHrAdmin ? "All submitted goals org-wide." : "Goals submitted by your direct reports.") +
      "</p>";

    html += '<div class="stack mt-6">';
    if (data.pending.length === 0) {
      html += '<p class="card muted" style="text-align:center;">Nothing waiting on your review.</p>';
    }
    data.pending.forEach(function (g) {
      html +=
        '<div class="card row" style="cursor:pointer" onclick="openApproval(\'' +
        g.id +
        '\')"><div><p style="font-weight:500">' +
        esc(g.employeeName) +
        '</p><p class="small muted">' +
        esc(g.designationName || "—") +
        "</p></div><span class=\"small muted\">Submitted " +
        (g.submittedAt ? new Date(g.submittedAt).toLocaleDateString() : "") +
        "</span></div>";
    });
    html += "</div>";

    if (data.decided.length > 0) {
      html += '<div class="mt-8"><h3>Recently decided</h3><div class="stack mt-2">';
      data.decided.forEach(function (g) {
        html +=
          '<div class="card row" style="cursor:pointer;padding:10px 16px" onclick="openApproval(\'' +
          g.id +
          "')\"><span>" +
          esc(g.employeeName) +
          "</span>" +
          statusBadge(g.status) +
          "</div>";
      });
      html += "</div></div>";
    }

    setContent(html);
  }

  function openApproval(goalId) {
    state.view = "approval-detail";
    state.approvalReturning = false;
    state.approvalComment = "";
    state.approvalError = null;
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getApprovalDetail", state.user.id, goalId).then(renderApprovalDetail).catch(showFatal);
  }

  function renderApprovalDetail(goal) {
    state.approvalDetail = goal;
    var html = navHtml();
    var weightSum = goal.kras.reduce(function (s, k) { return s + k.weight; }, 0);

    html += "<h1>" + esc(goal.employeeName) + "&rsquo;s Goal</h1>";
    html +=
      '<p class="small muted">' +
      esc(goal.employeeDesignationName || "No designation") +
      " &middot; Status: " +
      goal.status +
      "</p>";

    html += '<div class="mt-6"><div class="row"><h2>KRAs &amp; KPIs</h2>';
    html += '<span class="small muted">Total weightage: ' + weightSum + "%</span></div>";
    html += '<div class="stack mt-3">';
    goal.kras.forEach(function (kra) {
      html += '<div class="card"><div class="row"><p style="font-weight:500">' + esc(kra.title) + "</p>";
      html += '<span class="small muted">' + kra.weight + "%</span></div>";
      if (kra.description) html += '<p class="small muted mt-1">' + esc(kra.description) + "</p>";
      if (kra.kpis.length > 0) {
        html +=
          '<ul class="bullets small mt-2">' +
          kra.kpis
            .map(function (kpi) {
              return "<li>" + esc(kpi.title) + (kpi.target ? " — target: " + esc(kpi.target) : "") + "</li>";
            })
            .join("") +
          "</ul>";
      }
      html += "</div>";
    });
    html += "</div></div>";

    html += '<div class="mt-8"><div class="row"><h2>Role Readiness</h2>';
    var approvalIdealLabel = idealRatingLabel_(
      goal.promotionReadiness.targetMaturityMin,
      goal.promotionReadiness.targetMaturityMax
    );
    if (approvalIdealLabel) {
      html += '<span class="small muted">Expected Average Rating: ' + esc(approvalIdealLabel) + "/10</span>";
    }
    html += "</div>";
    if (goal.promotionReadiness.ratings.length === 0) {
      html += '<p class="small muted mt-2">No competencies to rate for this Business Role.</p>';
    } else {
      html += '<div class="stack mt-3">';
      goal.promotionReadiness.ratings.forEach(function (r) {
        var comp = r.competency;
        var level = r.subLevel !== null ? levelForSubLevel(comp.levels, r.subLevel) : null;
        html += '<div class="card"><div class="row"><p class="comp-name">' + esc(comp.name) + "</p>";
        html +=
          r.subLevel !== null
            ? '<span class="badge badge-neutral">' + (level ? level.level : "") + " &middot; " + r.subLevel + "/10</span>"
            : '<span class="small muted">Not yet rated</span>';
        html += "</div>";
        html += '<p class="small muted mt-1">' + esc(comp.cluster) + " &middot; " + esc(comp.subCluster) + "</p>";
        if (level) {
          html += '<p class="comp-level-name mt-2">' + esc(level.levelName) + "</p>";
          html +=
            '<ul class="bullets small muted mt-1">' +
            level.behaviourIndicators.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") +
            "</ul>";
        }
        if (r.selfComment) {
          html += '<p class="small mt-2"><strong>Self-Assessment Comments:</strong> ' + esc(r.selfComment) + "</p>";
        }
        html += "</div>";
      });
      html += "</div>";
    }
    html += "</div>";

    html += '<div class="mt-8"><h2>History</h2><div class="stack mt-3">';
    goal.approvalHistory.forEach(function (h) {
      html +=
        '<div class="card small muted history-item"><strong>' +
        h.action +
        "</strong> by " +
        esc(h.actorName) +
        " on " +
        new Date(h.createdAt).toLocaleString() +
        (h.comment ? '<p class="mt-1">' + esc(h.comment) + "</p>" : "") +
        "</div>";
    });
    html += "</div></div>";

    if (goal.status === "SUBMITTED") {
      html += '<div class="card mt-8"><h3>Manager decision</h3>';
      if (state.approvalError) {
        html += '<p class="alert alert-error mt-2">' + esc(state.approvalError) + "</p>";
      }
      if (state.approvalReturning) {
        html +=
          '<textarea rows="3" class="mt-3" id="return-comment" placeholder="Explain what needs revision...">' +
          esc(state.approvalComment) +
          "</textarea>";
      }
      html += '<div class="gap-2 mt-3">';
      html += '<button class="btn-approve" onclick="decide(\'' + goal.id + '\',\'APPROVE\')">Approve</button>';
      if (!state.approvalReturning) {
        html += '<button class="btn-secondary" onclick="startReturn()">Send back with comments</button>';
      } else {
        html += '<button class="btn-return" onclick="decide(\'' + goal.id + '\',\'RETURN\')">Confirm return</button>';
      }
      html += "</div></div>";
    }

    setContent(html);
    if (state.approvalReturning) {
      var el = document.getElementById("return-comment");
      if (el) el.addEventListener("input", function () { state.approvalComment = el.value; });
    }
  }

  function startReturn() {
    state.approvalReturning = true;
    renderApprovalDetail(state.approvalDetail);
  }

  function decide(goalId, action) {
    state.approvalError = null;
    if (action === "RETURN" && !state.approvalComment.trim()) {
      state.approvalError = "Please add a comment explaining what needs revision.";
      renderApprovalDetail(state.approvalDetail);
      return;
    }
    runRpc("decideGoal", state.user.id, goalId, action, state.approvalComment)
      .then(function () {
        goApprovals();
      })
      .catch(function (err) {
        state.approvalError = err.message || "Something went wrong.";
        renderApprovalDetail(state.approvalDetail);
      });
  }

  // ---------------------------------------------------------------------
  // Report (HR Admin only)
  // ---------------------------------------------------------------------
  function goReport() {
    state.view = "report";
    state.reportMessage = null;
    state.reportError = null;
    renderReport();
  }

  function renderReport() {
    var html = navHtml();
    html += "<h1>Report</h1>";
    html +=
      '<p class="muted mt-1">Regenerates the <strong>Report</strong> tab in your Google Sheet with every ' +
      "employee's goal status and career development rating progress, side by side.</p>";

    if (state.reportMessage) {
      html += '<p class="alert alert-ok mt-4">' + esc(state.reportMessage) + "</p>";
    }
    if (state.reportError) {
      html += '<p class="alert alert-error mt-4">' + esc(state.reportError) + "</p>";
    }

    html += '<div class="mt-6">';
    html += '<button class="btn-primary" onclick="generateReportClick()" id="generate-report-btn">Generate / refresh report</button>';
    html += "</div>";

    setContent(html);
  }

  function generateReportClick() {
    var btn = document.getElementById("generate-report-btn");
    if (btn) btn.disabled = true;
    state.reportMessage = null;
    state.reportError = null;
    runRpc("generateReportRpc", state.user.id)
      .then(function (result) {
        state.reportMessage = "Report tab updated with " + result.rowCount + " employee rows.";
        renderReport();
      })
      .catch(function (err) {
        state.reportError = err.message || "Something went wrong.";
        renderReport();
      });
  }

  // ---------------------------------------------------------------------
  // Errors + boot
  // ---------------------------------------------------------------------
  function showFatal(err) {
    setContent(
      '<div class="wrap"><p class="alert alert-error mt-6">' +
        esc(err.message || String(err)) +
        '</p><p class="mt-3"><span class="link" onclick="goDashboard()">Back to dashboard</span></p></div>'
    );
  }

  renderLogin();
</script>
