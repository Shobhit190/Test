<script>
  // ---------------------------------------------------------------------
  // State + RPC helper
  // ---------------------------------------------------------------------
  var state = {
    user: null,
    view: "login",
    loginError: null,
    busy: false,
    goal: null, // { goal, editable }
    kras: [],
    goalMessage: null,
    goalErrors: [],
    promotion: null, // { currentLevelName, targetLevelName, isTopLevel, options, ratings }
    promotionRatings: [],
    promotionMessage: null,
    approvals: null, // { pending, decided, isHrAdmin }
    approvalDetail: null,
    approvalReturning: false,
    approvalComment: "",
    approvalError: null,
  };

  var MIN_KRAS = 2, MAX_KRAS = 6, MAX_KPIS_PER_KRA = 3, KRA_WEIGHT_TOTAL = 100;

  function uid() {
    return "k" + Math.random().toString(36).slice(2, 10);
  }

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function runRpc(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          reject(err);
        });
      runner[fnName].apply(runner, args);
    });
  }

  function setContent(html) {
    document.getElementById("content").innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Nav shell
  // ---------------------------------------------------------------------
  function navHtml() {
    var u = state.user;
    var links = '<span class="navlink" onclick="goDashboard()">Goal Setting</span>' +
      '<span class="navlink" onclick="goGoal()">My Goal</span>' +
      '<span class="navlink" onclick="goPromotion()">Development</span>';
    if (u.systemRole === "MANAGER" || u.systemRole === "HR_ADMIN") {
      links += '<span class="navlink" onclick="goApprovals()">Approvals</span>';
    }
    return (
      '<nav class="topnav"><div class="left">' + links + '</div>' +
      '<div class="right"><span>' + esc(u.name) + " &middot; " + esc(u.systemRole) + "</span>" +
      '<span class="link" onclick="logout()">Sign out</span></div></nav>'
    );
  }

  function statusBadge(status) {
    return '<span class="badge badge-' + status + '">' + status + "</span>";
  }

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  function renderLogin() {
    var errorHtml = state.loginError
      ? '<p class="alert alert-error mt-4">' + esc(state.loginError) + "</p>"
      : "";
    setContent(
      '<div class="center-screen"><div class="login-box">' +
        "<h1>Goal Setting</h1>" +
        '<p class="muted mt-1">Sign in to continue</p>' +
        errorHtml +
        '<div class="stack mt-4">' +
        '<div><label class="small">Email</label>' +
        '<input type="email" id="login-email" placeholder="employee@example.com" /></div>' +
        '<div><label class="small">Password</label>' +
        '<input type="password" id="login-password" placeholder="password123" /></div>' +
        '<button class="btn-primary" onclick="doLogin()" id="login-btn">Sign in</button>' +
        "</div>" +
        '<p class="small muted mt-4">Demo accounts (password: password123):<br/>' +
        "employee@example.com &middot; manager@example.com &middot; hr.admin@example.com</p>" +
        "</div></div>"
    );
    document.getElementById("login-password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
  }

  function doLogin() {
    var email = document.getElementById("login-email").value;
    var password = document.getElementById("login-password").value;
    var btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Signing in...";
    runRpc("login", email, password)
      .then(function (user) {
        state.user = user;
        state.loginError = null;
        goGuidelines();
      })
      .catch(function (err) {
        state.loginError = err.message || "Invalid email or password.";
        renderLogin();
      });
  }

  function logout() {
    state.user = null;
    state.goal = null;
    state.approvals = null;
    state.approvalDetail = null;
    state.view = "login";
    renderLogin();
  }

  // ---------------------------------------------------------------------
  // Guidelines (shown once, right after login, before the dashboard)
  // ---------------------------------------------------------------------
  var GUIDELINES = [
    "Set 2–6 KRAs for your goal, with weights summing to 100%.",
    "KPIs are optional — add up to 3 per KRA if they'll help make it measurable.",
    "Save your draft any time — nothing is final until you submit it.",
    "Once submitted, your manager can approve it or send it back with comments for you to revise and resubmit.",
    "Before you submit, you'll also need to self-rate your promotion-readiness competencies on the Development tab. It isn't scored as part of your goal, but it's tracked over time, so take it seriously.",
  ];

  function goGuidelines() {
    state.view = "guidelines";
    var firstName = (state.user.name || "").split(" ")[0] || state.user.name;
    var html =
      '<div class="center-screen"><div class="login-box" style="max-width:480px;text-align:left">' +
      "<h1>Welcome, " +
      esc(firstName) +
      "</h1>" +
      '<p class="muted mt-1">A few quick guidelines before you get started:</p>' +
      '<ul class="bullets mt-4">' +
      GUIDELINES.map(function (g) {
        return "<li>" + esc(g) + "</li>";
      }).join("") +
      "</ul>" +
      '<button class="btn-primary mt-6" onclick="goDashboard()">Continue to Dashboard</button>' +
      "</div></div>";
    setContent(html);
  }

  // ---------------------------------------------------------------------
  // Dashboard
  // ---------------------------------------------------------------------
  function goDashboard() {
    state.view = "dashboard";
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getDashboard", state.user.id).then(renderDashboard).catch(showFatal);
  }

  function profileRow_(label, value) {
    return (
      '<div class="row"><span class="small muted">' +
      esc(label) +
      '</span><span class="small" style="font-weight:500">' +
      esc(value || "—") +
      "</span></div>"
    );
  }

  function renderDashboard(data) {
    var myGoal = data.myGoal;
    var p = data.profile;
    var html = navHtml();
    html += "<h1>Dashboard</h1>";
    html += '<p class="muted mt-1">Cycle: ' + esc(data.cycleName) + "</p>";

    html += '<div class="card mt-4"><h3>My Details</h3><div class="stack" style="gap:6px">';
    html += profileRow_("Employee Code", p.employeeCode);
    html += profileRow_("Brand", p.brand);
    html += profileRow_("Designation", p.designationName);
    html += profileRow_("Business Role", p.businessRole);
    html += profileRow_("Manager", p.managerName);
    html += profileRow_("Goal Cycle", p.goalCycle);
    html += profileRow_("Assessment Period", p.assessmentPeriod);
    html += "</div></div>";

    html += '<div class="card mt-6"><div class="row">';
    html += "<div><p><strong>My Goal</strong></p>";
    html +=
      '<p class="small muted mt-1">' +
      myGoal.kras.length +
      (myGoal.kras.length === 1 ? " KRA" : " KRAs") +
      "</p></div>";
    html +=
      '<div class="gap-3">' +
      statusBadge(myGoal.status) +
      '<span class="link" onclick="goGoal()">Open &rarr;</span></div>';
    html += "</div></div>";

    if (data.isManagerOrHr) {
      html += '<div class="mt-8"><div class="row">';
      html += "<h2>" + (data.isHrAdmin ? "Org-wide rollup" : "My team") + "</h2></div>";
      html += '<div class="stack mt-3">';
      if (data.teamGoals.length === 0) {
        html += '<p class="card muted" style="text-align:center;">No goals yet this cycle.</p>';
      }
      data.teamGoals.forEach(function (g) {
        var clickable = g.status !== "DRAFT";
        html +=
          '<div class="card row"' +
          (clickable ? ' style="cursor:pointer" onclick="openApproval(\'' + g.id + '\')"' : ' style="opacity:0.7"') +
          ">" +
          '<div><p style="font-weight:500">' +
          esc(g.employeeName) +
          '</p><p class="small muted">' +
          esc(g.designationName || "—") +
          "</p></div>" +
          statusBadge(g.status) +
          "</div>";
      });
      html += "</div></div>";
    }

    setContent(html);
  }

  // ---------------------------------------------------------------------
  // Goal screen
  // ---------------------------------------------------------------------
  var STATUS_LABELS = {
    DRAFT: "Draft",
    SUBMITTED: "Submitted — awaiting manager approval",
    APPROVED: "Approved",
    RETURNED: "Returned for revision",
  };

  function goGoal(preserveMessage) {
    state.view = "goal";
    if (!preserveMessage) state.goalMessage = null;
    state.goalErrors = [];
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getGoalScreen", state.user.id)
      .then(function (data) {
        state.goal = data;
        state.kras = data.goal.kras.map(function (k) {
          return {
            key: uid(),
            title: k.title,
            description: k.description || "",
            weight: k.weight,
            kpis: k.kpis.map(function (kpi) {
              return { key: uid(), title: kpi.title, target: kpi.target || "" };
            }),
          };
        });
        renderGoal();
      })
      .catch(showFatal);
  }

  function weightTotal() {
    return state.kras.reduce(function (sum, k) {
      return sum + (Number(k.weight) || 0);
    }, 0);
  }

  function levelForSubLevel(levels, subLevel) {
    for (var i = 0; i < levels.length; i++) {
      if (subLevel >= levels[i].subLevelMin && subLevel <= levels[i].subLevelMax) return levels[i];
    }
    return levels[0];
  }

  function renderGoal() {
    var editable = state.goal.editable;
    var html = navHtml();
    html +=
      '<div class="row"><h1>My Goal</h1><span class="badge" style="background:#f3f4f6;color:#374151">' +
      esc(STATUS_LABELS[state.goal.goal.status]) +
      "</span></div>";

    if (state.goal.goal.status === "RETURNED") {
      var lastReturn = state.goal.goal.approvalHistory
        .slice()
        .reverse()
        .filter(function (h) {
          return h.action === "RETURN";
        })[0];
      if (lastReturn) {
        html +=
          '<div class="alert alert-warn mt-4"><strong>Manager feedback (' +
          esc(lastReturn.actorName) +
          "):</strong><br/>" +
          esc(lastReturn.comment) +
          "</div>";
      }
    }

    if (!editable) {
      html += '<p class="alert alert-warn mt-4">This goal is read-only in its current state.</p>';
    }
    if (state.goalErrors.length > 0) {
      var needsPromotionRatings = state.goalErrors.some(function (e) {
        return e.indexOf("Development tab") !== -1;
      });
      html +=
        '<div class="alert alert-error mt-4"><strong>Please fix the following:</strong><ul class="bullets">' +
        state.goalErrors.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") +
        "</ul>" +
        (needsPromotionRatings
          ? '<span class="link small" onclick="goPromotion()">Go to the Development tab &rarr;</span>'
          : "") +
        "</div>";
    }
    if (state.goalMessage) {
      html += '<p class="alert alert-ok mt-4">' + esc(state.goalMessage) + "</p>";
    }

    // --- KRAs ---
    var total = weightTotal();
    html += '<div class="mt-6"><div class="row">';
    html += "<h2>KRAs &amp; KPIs</h2>";
    html +=
      '<span class="badge ' +
      (total === KRA_WEIGHT_TOTAL ? "badge-ok" : "badge-bad") +
      '" id="weight-total-badge">Total weight: ' +
      total +
      "% / " +
      KRA_WEIGHT_TOTAL +
      "%</span></div>";
    html +=
      '<p class="small muted mt-1">Between ' +
      MIN_KRAS +
      " and " +
      MAX_KRAS +
      " KRAs, weights summing to " +
      KRA_WEIGHT_TOTAL +
      "%. Up to " +
      MAX_KPIS_PER_KRA +
      " KPIs per KRA (optional).</p>";

    html += '<div class="stack mt-4">';
    state.kras.forEach(function (kra, kIndex) {
      html += '<div class="card">';
      html += '<div class="row-start">';
      html += '<div class="stack" style="flex:1">';
      html += '<div class="gap-2">';
      html +=
        '<input type="text" style="flex:1" placeholder="KRA #' +
        (kIndex + 1) +
        ' title" value="' +
        esc(kra.title) +
        '" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'title\',this.value)" />';
      html +=
        '<input type="number" style="width:90px" value="' +
        kra.weight +
        '" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'weight\',this.value)" /><span class="muted" style="align-self:center">%</span>';
      html += "</div>";
      html +=
        '<textarea rows="2" placeholder="Description (optional)" ' +
        (editable ? "" : "disabled ") +
        'oninput="updateKra(\'' +
        kra.key +
        '\',\'description\',this.value)">' +
        esc(kra.description) +
        "</textarea>";

      html += '<div class="stack" style="padding-left:8px;gap:6px">';
      kra.kpis.forEach(function (kpi) {
        html += '<div class="gap-2">';
        html +=
          '<input type="text" style="flex:1" placeholder="KPI" value="' +
          esc(kpi.title) +
          '" ' +
          (editable ? "" : "disabled ") +
          'oninput="updateKpi(\'' +
          kra.key +
          "','" +
          kpi.key +
          '\',\'title\',this.value)" />';
        html +=
          '<input type="text" style="width:160px" placeholder="Target" value="' +
          esc(kpi.target) +
          '" ' +
          (editable ? "" : "disabled ") +
          'oninput="updateKpi(\'' +
          kra.key +
          "','" +
          kpi.key +
          '\',\'target\',this.value)" />';
        if (editable) {
          html +=
            '<span class="btn-ghost" style="cursor:pointer" onclick="removeKpi(\'' +
            kra.key +
            "','" +
            kpi.key +
            '\')">Remove</span>';
        }
        html += "</div>";
      });
      if (editable && kra.kpis.length < MAX_KPIS_PER_KRA) {
        html += '<span class="link small" onclick="addKpi(\'' + kra.key + '\')">+ Add KPI</span>';
      }
      html += "</div>"; // kpis stack
      html += "</div>"; // kra fields stack

      if (editable) {
        html +=
          '<span class="btn-ghost" style="cursor:pointer" onclick="removeKra(\'' +
          kra.key +
          '\')">Remove KRA</span>';
      }
      html += "</div></div>"; // row-start, card
    });
    html += "</div>"; // kras stack

    if (editable && state.kras.length < MAX_KRAS) {
      html += '<button class="btn-dashed mt-3" onclick="addKra()">+ Add KRA</button>';
    }
    html += "</div>"; // KRA section

    if (editable) {
      html += '<div class="gap-2 mt-8" style="border-top:1px solid #e5e7eb;padding-top:20px">';
      html += '<button class="btn-secondary" onclick="saveDraft()" id="save-btn">Save draft</button>';
      html += '<button class="btn-primary" onclick="submitGoalClick()" id="submit-btn">Submit for approval</button>';
      html += "</div>";
    }

    setContent(html);
  }

  // Plain text/description fields update state only (no re-render) so the
  // input never loses focus mid-keystroke. Fields with live dependent UI
  // (weight -> total badge, subLevel -> level badge/name/bullets) patch
  // just that bit of DOM directly instead of re-rendering the whole screen.
  function updateKra(key, field, value) {
    state.kras.forEach(function (k) {
      if (k.key === key) k[field] = field === "weight" ? Number(value) : value;
    });
    if (field === "weight") updateWeightBadge();
  }
  function updateWeightBadge() {
    var el = document.getElementById("weight-total-badge");
    if (!el) return;
    var total = weightTotal();
    el.textContent = "Total weight: " + total + "% / " + KRA_WEIGHT_TOTAL + "%";
    el.className = "badge " + (total === KRA_WEIGHT_TOTAL ? "badge-ok" : "badge-bad");
  }
  function addKra() {
    if (state.kras.length >= MAX_KRAS) return;
    state.kras.push({ key: uid(), title: "", description: "", weight: 0, kpis: [] });
    renderGoal();
  }
  function removeKra(key) {
    state.kras = state.kras.filter(function (k) { return k.key !== key; });
    renderGoal();
  }
  function addKpi(kraKey) {
    state.kras.forEach(function (k) {
      if (k.key === kraKey && k.kpis.length < MAX_KPIS_PER_KRA) {
        k.kpis.push({ key: uid(), title: "", target: "" });
      }
    });
    renderGoal();
  }
  function updateKpi(kraKey, kpiKey, field, value) {
    state.kras.forEach(function (k) {
      if (k.key !== kraKey) return;
      k.kpis.forEach(function (kpi) {
        if (kpi.key === kpiKey) kpi[field] = value;
      });
    });
    // No re-render: title/target have no live dependent UI to update.
  }
  function removeKpi(kraKey, kpiKey) {
    state.kras.forEach(function (k) {
      if (k.key === kraKey) k.kpis = k.kpis.filter(function (kpi) { return kpi.key !== kpiKey; });
    });
    renderGoal();
  }
  function goalPayload() {
    return {
      kras: state.kras.map(function (k) {
        return {
          title: k.title,
          description: k.description,
          weight: Number(k.weight) || 0,
          kpis: k.kpis.map(function (kpi) {
            return { title: kpi.title, target: kpi.target };
          }),
        };
      }),
    };
  }

  // saveDraft/submitGoalClick disable both buttons for the duration of the
  // round trip: without this, a second click before the first request
  // returns (easy to do while waiting on a slow response) fires an
  // overlapping saveGoalDraft call, which can leave duplicate KRA rows.
  function setGoalButtonsBusy_(busy) {
    ["save-btn", "submit-btn"].forEach(function (id) {
      var btn = document.getElementById(id);
      if (btn) btn.disabled = busy;
    });
  }

  function saveDraft() {
    state.goalMessage = null;
    state.goalErrors = [];
    setGoalButtonsBusy_(true);
    var payload = goalPayload();
    runRpc("saveGoalDraft", state.user.id, state.goal.goal.id, payload.kras)
      .then(function (result) {
        if (!result.ok) {
          state.goalErrors = result.errors;
          setGoalButtonsBusy_(false);
          renderGoal();
        } else {
          state.goalMessage = "Draft saved.";
          goGoal(true);
        }
      })
      .catch(function (err) {
        setGoalButtonsBusy_(false);
        showFatal(err);
      });
  }

  function submitGoalClick() {
    state.goalMessage = null;
    state.goalErrors = [];
    setGoalButtonsBusy_(true);
    var payload = goalPayload();
    runRpc("saveGoalDraft", state.user.id, state.goal.goal.id, payload.kras)
      .then(function (saveResult) {
        if (!saveResult.ok) {
          state.goalErrors = saveResult.errors;
          setGoalButtonsBusy_(false);
          renderGoal();
          return null;
        }
        return runRpc("submitGoal", state.user.id, state.goal.goal.id);
      })
      .then(function (submitResult) {
        if (!submitResult) return;
        if (!submitResult.ok) {
          state.goalErrors = submitResult.errors;
          setGoalButtonsBusy_(false);
          renderGoal();
        } else {
          state.goalMessage = "Goal submitted for manager approval.";
          goGoal(true);
        }
      })
      .catch(function (err) {
        setGoalButtonsBusy_(false);
        showFatal(err);
      });
  }

  // ---------------------------------------------------------------------
  // Development / promotion-readiness self-assessment
  // ---------------------------------------------------------------------
  function goPromotion(preserveMessage) {
    state.view = "promotion";
    if (!preserveMessage) state.promotionMessage = null;
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getPromotionScreen", state.user.id)
      .then(function (data) {
        state.promotion = data;
        var byCompetency = {};
        data.ratings.forEach(function (r) {
          byCompetency[r.competencyId] = r;
        });
        state.promotionRatings = data.options.map(function (o) {
          var existing = byCompetency[o.competency.id];
          return {
            competencyId: o.competency.id,
            subLevel: existing ? existing.subLevel : 5,
            selfComment: existing ? existing.selfComment : "",
          };
        });
        renderPromotion();
      })
      .catch(showFatal);
  }

  function promotionRatingByCompetency_(competencyId) {
    return state.promotionRatings.filter(function (r) {
      return r.competencyId === competencyId;
    })[0];
  }

  function renderPromotion() {
    var p = state.promotion;
    var html = navHtml();
    html += "<h1>Promotion Readiness</h1>";

    if (state.promotionMessage) {
      html += '<p class="alert alert-ok mt-4">' + esc(state.promotionMessage) + "</p>";
    }

    if (!p.currentLevelName) {
      html +=
        '<p class="alert alert-warn mt-4">Your Business Role isn\'t set yet, so there are no competencies to ' +
        "show here. Ask HR to add it to your profile.</p>";
      setContent(html);
      return;
    }

    if (p.isTopLevel) {
      html +=
        '<p class="muted mt-1">You\'re at the top of the ladder (' +
        esc(p.currentLevelName) +
        "). Rate yourself against your own level's competencies to keep tracking your growth.</p>";
    } else {
      html +=
        '<p class="muted mt-1">You\'re currently at the ' +
        esc(p.currentLevelName) +
        " level. These are the competencies expected at the next level, <strong>" +
        esc(p.targetLevelName) +
        "</strong>.</p>";
    }
    html +=
      '<p class="small muted mt-2">This isn\'t scored as part of your goal, but you must rate every ' +
      "competency below before you can submit it. Rate yourself honestly on what you think you can achieve " +
      "in each one — this is what's tracked for your promotion readiness over time, so it's worth taking " +
      "seriously.</p>";

    html += '<div class="stack mt-6">';
    p.options.forEach(function (o) {
      var comp = o.competency;
      var rating = promotionRatingByCompetency_(comp.id);
      var level = levelForSubLevel(comp.levels, rating.subLevel);
      html += '<div class="card">';
      html += '<div class="row-start"><div>';
      html += '<p style="font-weight:500">' + esc(comp.name) + "</p>";
      html += '<p class="small muted">' + esc(comp.cluster) + " &middot; " + esc(comp.subCluster) + "</p>";
      html += "</div></div>";

      html += '<div class="gap-3 mt-3">';
      html +=
        '<input type="range" min="1" max="10" value="' +
        rating.subLevel +
        '" oninput="updatePromotionRating(\'' +
        comp.id +
        '\',\'subLevel\',this.value)" />';
      html +=
        '<span class="badge" style="background:#f3f4f6;color:#111827;white-space:nowrap" id="promo-level-badge-' +
        comp.id +
        '">' +
        (level ? level.level : "") +
        " &middot; " +
        rating.subLevel +
        "/10</span></div>";
      html +=
        '<p class="small mt-1" style="font-weight:600" id="promo-level-name-' +
        comp.id +
        '">' +
        (level ? esc(level.levelName) : "") +
        "</p>";

      html +=
        '<ul class="bullets small muted mt-2" id="promo-level-bullets-' +
        comp.id +
        '">' +
        (level
          ? level.behaviourIndicators.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("")
          : "") +
        "</ul>";

      html +=
        '<textarea rows="2" class="mt-3" placeholder="Self-assessment comment (optional)" ' +
        'oninput="updatePromotionRating(\'' +
        comp.id +
        '\',\'selfComment\',this.value)">' +
        esc(rating.selfComment) +
        "</textarea>";
      html += "</div>";
      html += "</div>";
    });
    html += "</div>";

    html += '<div class="gap-2 mt-8" style="border-top:1px solid #e5e7eb;padding-top:20px">';
    html += '<button class="btn-primary" onclick="savePromotionRatingsClick()" id="save-promotion-btn">Save ratings</button>';
    html += "</div>";

    setContent(html);
  }

  function updatePromotionRating(competencyId, field, value) {
    var rating = promotionRatingByCompetency_(competencyId);
    if (!rating) return;
    rating[field] = field === "subLevel" ? Number(value) : value;
    if (field === "subLevel") updatePromotionRatingLevelUI(competencyId);
  }

  function promotionOptionByCompetency_(competencyId) {
    var opt = state.promotion.options.filter(function (o) {
      return o.competency.id === competencyId;
    })[0];
    return opt ? opt.competency : null;
  }

  function updatePromotionRatingLevelUI(competencyId) {
    var rating = promotionRatingByCompetency_(competencyId);
    var comp = promotionOptionByCompetency_(competencyId);
    if (!rating || !comp) return;
    var level = levelForSubLevel(comp.levels, rating.subLevel);

    var badge = document.getElementById("promo-level-badge-" + competencyId);
    if (badge) badge.textContent = (level ? level.level : "") + " · " + rating.subLevel + "/10";

    var nameEl = document.getElementById("promo-level-name-" + competencyId);
    if (nameEl) nameEl.textContent = level ? level.levelName : "";

    var bulletsEl = document.getElementById("promo-level-bullets-" + competencyId);
    if (bulletsEl) {
      bulletsEl.innerHTML = level
        ? level.behaviourIndicators.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("")
        : "";
    }
  }

  function savePromotionRatingsClick() {
    var btn = document.getElementById("save-promotion-btn");
    if (btn) btn.disabled = true;
    runRpc("savePromotionRatings", state.user.id, state.promotionRatings)
      .then(function () {
        state.promotionMessage = "Ratings saved.";
        goPromotion(true);
      })
      .catch(showFatal);
  }

  // ---------------------------------------------------------------------
  // Approvals
  // ---------------------------------------------------------------------
  function goApprovals() {
    state.view = "approvals";
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getApprovalQueue", state.user.id).then(renderApprovals).catch(showFatal);
  }

  function renderApprovals(data) {
    state.approvals = data;
    var html = navHtml();
    html += "<h1>Approval Queue</h1>";
    html +=
      '<p class="small muted mt-1">' +
      (data.isHrAdmin ? "All submitted goals org-wide." : "Goals submitted by your direct reports.") +
      "</p>";

    html += '<div class="stack mt-6">';
    if (data.pending.length === 0) {
      html += '<p class="card muted" style="text-align:center;">Nothing waiting on your review.</p>';
    }
    data.pending.forEach(function (g) {
      html +=
        '<div class="card row" style="cursor:pointer" onclick="openApproval(\'' +
        g.id +
        '\')"><div><p style="font-weight:500">' +
        esc(g.employeeName) +
        '</p><p class="small muted">' +
        esc(g.designationName || "—") +
        "</p></div><span class=\"small muted\">Submitted " +
        (g.submittedAt ? new Date(g.submittedAt).toLocaleDateString() : "") +
        "</span></div>";
    });
    html += "</div>";

    if (data.decided.length > 0) {
      html += '<div class="mt-8"><h3>Recently decided</h3><div class="stack mt-2">';
      data.decided.forEach(function (g) {
        html +=
          '<div class="card row" style="cursor:pointer;padding:10px 16px" onclick="openApproval(\'' +
          g.id +
          "')\"><span>" +
          esc(g.employeeName) +
          "</span>" +
          statusBadge(g.status) +
          "</div>";
      });
      html += "</div></div>";
    }

    setContent(html);
  }

  function openApproval(goalId) {
    state.view = "approval-detail";
    state.approvalReturning = false;
    state.approvalComment = "";
    state.approvalError = null;
    setContent('<div class="center-screen"><p class="spinner-inline">Loading…</p></div>');
    runRpc("getApprovalDetail", state.user.id, goalId).then(renderApprovalDetail).catch(showFatal);
  }

  function renderApprovalDetail(goal) {
    state.approvalDetail = goal;
    var html = navHtml();
    var weightSum = goal.kras.reduce(function (s, k) { return s + k.weight; }, 0);

    html += "<h1>" + esc(goal.employeeName) + "&rsquo;s Goal</h1>";
    html +=
      '<p class="small muted">' +
      esc(goal.employeeDesignationName || "No designation") +
      " &middot; Status: " +
      goal.status +
      "</p>";

    html += '<div class="mt-6"><div class="row"><h2>KRAs &amp; KPIs</h2>';
    html += '<span class="small muted">Total weight: ' + weightSum + "%</span></div>";
    html += '<div class="stack mt-3">';
    goal.kras.forEach(function (kra) {
      html += '<div class="card"><div class="row"><p style="font-weight:500">' + esc(kra.title) + "</p>";
      html += '<span class="small muted">' + kra.weight + "%</span></div>";
      if (kra.description) html += '<p class="small muted mt-1">' + esc(kra.description) + "</p>";
      if (kra.kpis.length > 0) {
        html +=
          '<ul class="bullets small mt-2">' +
          kra.kpis
            .map(function (kpi) {
              return "<li>" + esc(kpi.title) + (kpi.target ? " — target: " + esc(kpi.target) : "") + "</li>";
            })
            .join("") +
          "</ul>";
      }
      html += "</div>";
    });
    html += "</div></div>";

    html += '<div class="mt-8"><h2>History</h2><div class="stack mt-3">';
    goal.approvalHistory.forEach(function (h) {
      html +=
        '<div class="card small muted" style="background:#f9fafb"><strong style="color:#111827">' +
        h.action +
        "</strong> by " +
        esc(h.actorName) +
        " on " +
        new Date(h.createdAt).toLocaleString() +
        (h.comment ? '<p class="mt-1">' + esc(h.comment) + "</p>" : "") +
        "</div>";
    });
    html += "</div></div>";

    if (goal.status === "SUBMITTED") {
      html += '<div class="card mt-8"><h3>Manager decision</h3>';
      if (state.approvalError) {
        html += '<p class="alert alert-error mt-2">' + esc(state.approvalError) + "</p>";
      }
      if (state.approvalReturning) {
        html +=
          '<textarea rows="3" class="mt-3" id="return-comment" placeholder="Explain what needs revision...">' +
          esc(state.approvalComment) +
          "</textarea>";
      }
      html += '<div class="gap-2 mt-3">';
      html += '<button class="btn-approve" onclick="decide(\'' + goal.id + '\',\'APPROVE\')">Approve</button>';
      if (!state.approvalReturning) {
        html += '<button class="btn-secondary" onclick="startReturn()">Send back with comments</button>';
      } else {
        html += '<button class="btn-return" onclick="decide(\'' + goal.id + '\',\'RETURN\')">Confirm return</button>';
      }
      html += "</div></div>";
    }

    setContent(html);
    if (state.approvalReturning) {
      var el = document.getElementById("return-comment");
      if (el) el.addEventListener("input", function () { state.approvalComment = el.value; });
    }
  }

  function startReturn() {
    state.approvalReturning = true;
    renderApprovalDetail(state.approvalDetail);
  }

  function decide(goalId, action) {
    state.approvalError = null;
    if (action === "RETURN" && !state.approvalComment.trim()) {
      state.approvalError = "Please add a comment explaining what needs revision.";
      renderApprovalDetail(state.approvalDetail);
      return;
    }
    runRpc("decideGoal", state.user.id, goalId, action, state.approvalComment)
      .then(function () {
        goApprovals();
      })
      .catch(function (err) {
        state.approvalError = err.message || "Something went wrong.";
        renderApprovalDetail(state.approvalDetail);
      });
  }

  // ---------------------------------------------------------------------
  // Errors + boot
  // ---------------------------------------------------------------------
  function showFatal(err) {
    setContent(
      '<div class="wrap"><p class="alert alert-error mt-6">' +
        esc(err.message || String(err)) +
        '</p><p class="mt-3"><span class="link" onclick="goDashboard()">Back to dashboard</span></p></div>'
    );
  }

  renderLogin();
</script>
